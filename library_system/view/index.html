<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>University Library System</title>
</head>
<body>

<h1>University Library Management System</h1>
<p>Manage book records- Add, View, Edit, Delete</p>

<div id="message"></div>

<h2 id="formTitle">Add New Book</h2>

<input type="hidden" id="editId"/>

<label>Book Title</label><br/>
<input type="text" id="bookTitle" placeholder="Enter book title"/><br/><br/>

<label>Author Name</label><br/>
<input type="text" id="bookAuthor" placeholder="Enter author name"/><br/><br/>

<label>Category</label><br/>
<select id="bookCategory">
  <option value=""> Select Category </option>
  <option>Programming</option>
  <option>Computer Science</option>
  <option>Fiction</option>
  <option>History</option>
  <option>Science</option>
  <option>Mathematics</option>
  <option>Psychology</option>
  <option>Philosophy</option>
  <option>Engineering</option>
  <option>Business</option>
  <option>Other</option>
</select><br/><br/>

<label>Availability Status</label><br/>
<select id="bookStatus">
  <option value="">-- Select Status --</option>
  <option value="Available">Available</option>
  <option value="Not Available">Not Available</option>
</select><br/><br/>

<button onclick="handleSubmit()" id="submitBtn">Add Book</button>
<button onclick="resetForm()" id="cancelBtn" style="display:none">Cancel</button>

<hr/>

<h2>All Books</h2>

<input type="text" id="searchInput" placeholder="Search by title or author…" oninput="debounceSearch()"/>
&nbsp;
<button onclick="loadBooks()">Refresh</button>

<br/><br/>

<table border="1" cellpadding="6" cellspacing="0">
  <thead>
    <tr>
      <th>#</th>
      <th>Title</th>
      <th>Author</th>
      <th>Category</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="tableBody">
    <tr><td colspan="6">Loading…</td></tr>
  </tbody>
</table>

<script>
  var HANDLER = 'controller/book_controller.php';
  var searchTimer = null;

  function ajax(method, params, cb) {
    var xhr = new XMLHttpRequest();

    if (method === 'GET') {
      var qs = '';
      for (var key in params) {
        qs += (qs ? '&' : '?') + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
      }
      xhr.open('GET', HANDLER + qs, true);
      xhr.send();
    } else {
      var fd = new FormData();
      for (var key in params) fd.append(key, params[key]);
      xhr.open('POST', HANDLER, true);
      xhr.send(fd);
    }

    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      try {
        cb(JSON.parse(xhr.responseText));
      } catch (e) {
        cb({ success: false, message: 'Invalid server response.' });
      }
    };

    xhr.onerror = function () {
      cb({ success: false, message: 'Network error.' });
    };
  }


  function showMessage(text) {
    document.getElementById('message').innerHTML = '<p>' + text + '</p>';
  }


  function loadBooks(search) {
    var params = { action: 'read' };
    if (search) params.search = search;

    ajax('GET', params, function (data) {
      var tbody = document.getElementById('tableBody');
      var books = data.data || [];

      if (!books.length) {
        tbody.innerHTML = '<tr><td colspan="6">No books found.</td></tr>';
        return;
      }

      var html = '';
      for (var i = 0; i < books.length; i++) {
        var b = books[i];
        html += '<tr>';
        html += '<td>' + b.id + '</td>';
        html += '<td>' + b.title + '</td>';
        html += '<td>' + b.author + '</td>';
        html += '<td>' + b.category + '</td>';
        html += '<td>' + b.status + '</td>';
        html += '<td>';
        html += '<button onclick="editBook(' + b.id + ')">Edit</button> ';
        html += '<button onclick="deleteBook(' + b.id + ', \'' + b.title.replace(/'/g, "\\'") + '\')">Delete</button>';
        html += '</td>';
        html += '</tr>';
      }
      tbody.innerHTML = html;
    });
  }


  function handleSubmit() {
    var id       = document.getElementById('editId').value;
    var title    = document.getElementById('bookTitle').value.trim();
    var author   = document.getElementById('bookAuthor').value.trim();
    var category = document.getElementById('bookCategory').value;
    var status   = document.getElementById('bookStatus').value;

    if (!title || !author || !category || !status) {
      showMessage('Please fill in all fields.');
      return;
    }

    var isEdit = id !== '';
    var params = {
      action:   isEdit ? 'update' : 'add',
      title:    title,
      author:   author,
      category: category,
      status:   status
    };
    if (isEdit) params.id = id;

    ajax('POST', params, function (data) {
      showMessage(data.message);
      if (data.success) {
        resetForm();
        loadBooks();
      }
    });
  }


  function editBook(id) {
    ajax('GET', { action: 'getOne', id: id }, function (data) {
      if (!data.success) { showMessage(data.message); return; }
      var b = data.data;
      document.getElementById('editId').value          = b.id;
      document.getElementById('bookTitle').value       = b.title;
      document.getElementById('bookAuthor').value      = b.author;
      document.getElementById('bookCategory').value    = b.category;
      document.getElementById('bookStatus').value      = b.status;
      document.getElementById('formTitle').textContent = 'Edit Book';
      document.getElementById('submitBtn').textContent = 'Save Changes';
      document.getElementById('cancelBtn').style.display = '';
    });
  }

  
  function deleteBook(id, title) {
    if (!confirm('Delete "' + title + '"? This cannot be undone.')) return;

    ajax('POST', { action: 'delete', id: id }, function (data) {
      showMessage(data.message);
      if (data.success) loadBooks();
    });
  }


  function resetForm() {
    document.getElementById('editId').value            = '';
    document.getElementById('bookTitle').value         = '';
    document.getElementById('bookAuthor').value        = '';
    document.getElementById('bookCategory').value      = '';
    document.getElementById('bookStatus').value        = '';
    document.getElementById('formTitle').textContent   = 'Add New Book';
    document.getElementById('submitBtn').textContent   = 'Add Book';
    document.getElementById('cancelBtn').style.display = 'none';
  }


  function debounceSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      loadBooks(document.getElementById('searchInput').value.trim());
    }, 350);
  }

  window.onload = function () { loadBooks(); };
</script>

</body>
</html>
