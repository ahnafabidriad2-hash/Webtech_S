<!DOCTYPE html>
<html>
<head>
    <title>Lab Task 02</title>
</head>
<body>

<h2>Lab Task 02</h2>

<script>
    function calculateSum(a, b) {
        return a + b;
    }

    var result = calculateSum(5, 10);
    document.write("Sum of 5 and 10 is: " + result + "<br><br>");

    document.write("Numbers from 1 to 10:<br>");
    for (var i = 1; i <= 10; i++) {
        document.write(i + " ");
    }

    document.write("<br>");

    document.write("Even numbers from 1 to 20:<br>");
    var num = 2;
    while (num <= 20) {
        document.write(num + " ");
        num = num + 2;
    }

    document.write("<br><br>");

    var fullName = "John Smith";
    var upperName = fullName.toUpperCase();
    var nameLength = fullName.length;
    var firstName = fullName.split(" ")[0];

    document.write("Original Name: " + fullName + "<br>");
    document.write("Uppercase: " + upperName + "<br>");
    document.write("Length: " + nameLength + "<br>");
    document.write("First Name: " + firstName + "<br>");

    document.write("<br>");
    function checkStringLength(str) {
        if (str.length > 5) {
            document.write("The string length is greater than 5.");
        } else {
            document.write("The string length is 5 or less.");
        }
    }

    var userInput = prompt("Enter a word:");
    checkStringLength(userInput);

</script>

</body>
</html>
