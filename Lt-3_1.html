<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab Task 03 </title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <h1>CSS Box Model Demonstration</h1>

    <div class="box box1">Box 1 (Default )</div>
    <div class="box box2">Box 2 (Different Spacing)</div>
    <div class="box box3">Box 3 (Border-Box)</div>

    <hr>

    <h2>Display Properties</h2>

    <div class="display-block">Display: Block</div>

    <span class="display-inline">Inline 1</span>
    <span class="display-inline">Inline 2</span>

    <p class="display-inline-block">Inline-Block Paragraph</p>

    <div class="display-none">It is not visible</div>

    <hr>

    <h2>Visibility vs Display</h2>

    <div class="visible-box">Normal Visible Box</div>
    <div class="hidden-box">Visibility Hidden Box</div>
    <div class="removed-box">Display None Box</div>

</body>
</html>
