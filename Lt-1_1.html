<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Lab Task</title>

    <link rel="stylesheet" href="style1.css">
    <style>
        * {
            font-family: Arial, sans-serif;
        }

        p {
            font-size: 16px;
            color: darkblue;
        }

        .highlight {
            background-color: azure;
            color: red;
            font-size: 18px;
        }

        #mainTitle {
            color: darkgreen;
            font-size: 28px;
        }
    </style>
</head>

<body>
    <h1 id="mainTitle" style="background-color: lightgray;">
        Welcome to CSS Lab Task
    </h1>

    <p>This is a simple paragraph showcasing internal CSS.</p>

    <p class="highlight">
        This paragraph uses class selector (.highlight).
    </p>

    <h1>Another Heading (Styled by External CSS)</h1>

</body>
</html>
