<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Info Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #student-info {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            display: none;
        }
        .student-detail {
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h1>Student Information Fetcher</h1>
    <button onclick="fetchStudentData()">Get Student Info</button>

    <div id="student-info">
        <div class="student-detail"><strong>Name:</strong> <span id="name"></span></div>
        <div class="student-detail"><strong>ID:</strong> <span id="id"></span></div>
        <div class="student-detail"><strong>Department:</strong> <span id="department"></span></div>
        <div class="student-detail"><strong>CGPA:</strong> <span id="cgpa"></span></div>
    </div>

    <script>
        // Function to fetch student data using AJAX
        function fetchStudentData() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "fetch_student_data.php", true);
            xhr.setRequestHeader("Content-Type", "application/json");

            xhr.onload = function() {
                if (xhr.status == 200) {
                    var studentData = JSON.parse(xhr.responseText); 
                    document.getElementById('name').textContent = studentData.name;
                    document.getElementById('id').textContent = studentData.id;
                    document.getElementById('department').textContent = studentData.department;
                    document.getElementById('cgpa').textContent = studentData.cgpa;
                    document.getElementById('student-info').style.display = 'block';
                }
            };

            xhr.send(); 
        }
    </script>

</body>
</html>
