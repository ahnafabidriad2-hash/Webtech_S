<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance</title>
    <style>
        .highlight {
            border: 2px solid red;
            background-color: lightyellow;
        }
        .present {
            background-color: green;
            color: white;
        }
        .absent {
            background-color: red;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Student Attendance</h1>

    <!-- Input fields for Name and Roll No -->
    <input type="text" id="studentName" placeholder="Enter student name">
    <input type="text" id="studentRoll" placeholder="Enter roll number">
    <button id="addStudentBtn" disabled>Add Student</button>

    <h2>Students</h2>
    <input type="text" id="search" placeholder="Search student">
    
    <ul id="studentList"></ul>

    <p id="totalStudents">Total students: 0</p>
    
    <!-- Buttons -->
    <button id="sortBtn">Sort A-Z</button>
    <button id="highlightBtn">Highlight First Student</button>

    <p>Present: <span id="presentCount">0</span>, Absent: <span id="absentCount">0</span></p>

    <script>
        // Get elements
        const studentNameInput = document.getElementById('studentName');
        const studentRollInput = document.getElementById('studentRoll');
        const addStudentBtn = document.getElementById('addStudentBtn');
        const studentList = document.getElementById('studentList');
        const totalStudents = document.getElementById('totalStudents');
        const searchInput = document.getElementById('search');
        const presentCountSpan = document.getElementById('presentCount');
        const absentCountSpan = document.getElementById('absentCount');
        const sortBtn = document.getElementById('sortBtn');
        const highlightBtn = document.getElementById('highlightBtn');

        let students = [];
        let presentCount = 0;
        let absentCount = 0;

        // Update total students count
        function updateTotalStudents() {
            totalStudents.textContent = `Total students: ${students.length}`;
        }

        // Update attendance count
        function updateAttendanceCount() {
            presentCountSpan.textContent = presentCount;
            absentCountSpan.textContent = absentCount;
        }

        // Render all students in the list
        function renderStudents() {
            studentList.innerHTML = ''; // Clear the list before rendering
            students.forEach(function(student) {
                const li = document.createElement('li');
                li.textContent = `${student.roll} - ${student.name}`;
                if (student.isPresent) {
                    li.classList.add('present');
                } else {
                    li.classList.add('absent');
                }

                // Add Present button
                const presentBtn = document.createElement('button');
                presentBtn.textContent = 'Present';
                presentBtn.onclick = function() {
                    student.isPresent = true;
                    presentCount++;
                    absentCount--;
                    renderStudents();
                    updateAttendanceCount();
                };

                // Add Absent button
                const absentBtn = document.createElement('button');
                absentBtn.textContent = 'Absent';
                absentBtn.onclick = function() {
                    student.isPresent = false;
                    presentCount--;
                    absentCount++;
                    renderStudents();
                    updateAttendanceCount();
                };

                // Add Delete button
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = function() {
                    if (confirm("Are you sure you want to delete this student?")) {
                        students = students.filter(s => s !== student);
                        renderStudents();
                        updateTotalStudents();
                        updateAttendanceCount();
                    }
                };

                li.appendChild(presentBtn);
                li.appendChild(absentBtn);
                li.appendChild(deleteBtn);

                studentList.appendChild(li);
            });
        }

        // Add Student functionality
        addStudentBtn.onclick = function() {
            const name = studentNameInput.value.trim();
            const roll = studentRollInput.value.trim();

            if (name && roll) {
                const newStudent = {
                    name: name,
                    roll: roll,
                    isPresent: false,
                };
                students.push(newStudent);
                renderStudents();
                studentNameInput.value = '';
                studentRollInput.value = '';
                addStudentBtn.disabled = true; // Disable Add button after adding
                updateTotalStudents();
                updateAttendanceCount();
            }
        };

        // Enable Add button only when name input is not empty
        studentNameInput.addEventListener('input', function() {
            addStudentBtn.disabled = !studentNameInput.value.trim();
        });

        // Search functionality
        searchInput.addEventListener('input', function() {
            const searchText = searchInput.value.toLowerCase();
            students.forEach(function(student, index) {
                const li = studentList.children[index];
                if (student.name.toLowerCase().includes(searchText)) {
                    li.style.display = 'list-item';
                } else {
                    li.style.display = 'none';
                }
            });
        });

        // Sort Students alphabetically
        sortBtn.onclick = function() {
            students.sort(function(a, b) {
                return a.name.localeCompare(b.name);
            });
            renderStudents();
        };

        // Highlight the first student
        highlightBtn.onclick = function() {
            Array.from(studentList.children).forEach(function(li) {
                li.classList.remove('highlight');
            });
            if (studentList.children.length > 0) {
                studentList.children[0].classList.add('highlight');
            }
        };
    </script>
</body>
</html>
